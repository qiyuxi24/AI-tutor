# ════════════════════════════════════════════
# AI Tutor - Nginx 配置
# 职责：托管前端静态资源 + 将 /api 反代到后端 Uvicorn(127.0.0.1:8000)
# 关键点：SSE 流式对话必须关闭 proxy_buffering，否则 token 不实时推送
# ════════════════════════════════════════════
server {
    listen 80;
    server_name _;

    # 知识库上传文件（pdf/图片等）大小上限，默认 1m 不够
    client_max_body_size 100m;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # 前端包里有 961KB 的 element-plus 与 908KB 的 exceljs，压完约 1/3
    gzip_comp_level 6;

    # ─── 静态资源缓存（2026-11-16）───
    # Vite 产物文件名带内容哈希（index-CHUjyp_o.js），可以永久缓存：内容一变文件名
    # 就变，不存在"缓存了旧代码"。此前没有这条，每次访问都要重新下载 400KB CSS +
    # 961KB 预加载块，首屏要把这些字节重新走一遍网络。
    # 只用 add_header 而不用 `expires`：后者自己也会写一条 Cache-Control，
    # 两条会同时出现在响应里。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 反过来必须每次回源校验：它里面写着当次构建的资源哈希名，
    # 缓存住它 = 发布新版本后用户还在请求旧文件名（404 或回退到旧包）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ─── 后端 API 反代 ───
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / 长连接（chat/stream 两阶段流式响应必须）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── 前端路由兜底（hash 路由基本用不到，保留以防 index 静态页 404）───
    location / {
        try_files $uri $uri/ /index.html;
    }
}
