# ═══════════════════════════════════════════════════════════════
# AI Tutor Docker 编排
# 用法：
#   1. 复制根目录 .env.example 为 .env 并填入 DASHSCOPE_API_KEY / SECRET_KEY
#   2. docker compose up -d --build
#   3. 浏览器访问 http://服务器IP:8080
# ═══════════════════════════════════════════════════════════════
services:
  ai-tutor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-tutor:latest
    container_name: ai-tutor
    restart: unless-stopped

    # 宿主机 ${PORT} 端口 → 容器 80（Nginx）
    ports:
      - "${PORT:-8080}:80"

    # 整份 .env 注入容器：.dockerignore 排除了 .env，容器内 load_dotenv 读不到文件，
    # 只能靠注入。下面的 environment 是「显式契约 + 启动期校验」，优先级高于本项
    # （不写死白名单的原因：config.py 有 20+ 字段，白名单必然漂移 → 新配置静默失效）
    env_file:
      - .env

    environment:
      # 对话主模型 / 嵌入服务（:? 语法：未配置直接报错，防止静默启动失败）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?请在根目录 .env 中配置 DASHSCOPE_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.minimaxi.com/v1}
      - MODEL_NAME=${MODEL_NAME:-MiniMax-M3}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # JWT 签名密钥
      - SECRET_KEY=${SECRET_KEY:?请在根目录 .env 中配置 SECRET_KEY}
      # CORS（同源部署不需要；直连 8000 才需要放开）
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost}
      # 代理信任边界（uvicorn 默认只信 127.0.0.1）：容器 nginx 的上游 peer 是 docker
      # 网桥地址（默认 172.17.0.1，落在 172.16.0.0/12），不在默认信任集里 → 应用层拿到的
      # client_ip 恒为网桥地址，所有访客共用一个限流桶（一个人就能把全站挡在门外）。
      # 补上网桥网段后，uvicorn 才会沿 X-Forwarded-For 从右往左取到真实访客 IP。
      # ⚠️ 前提：宿主 nginx 必须设 X-Forwarded-For（见 deploy/gateway-nginx.conf）；
      #    若改过 default-address-pools，这里同步换成实际网段。
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}
      # 管理员初始密码（留空则不自动创建）
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}

    volumes:
      # ── 运行时数据持久化（宿主机目录需预先创建；提示词模板 data/prompts 留在镜像内）──
      # A1b 后全部收敛进单一 /app/data（= storage.DATA_ROOT）：知识库/图谱/题库/采集/模型配置/
      # 运行记录/列表全部落 /app/data/<域>；不再挂 /app/backend/data 或 /app/backend/app/data。
      # 提示词模板（/app/data/prompts）由镜像 baked，故**保留子目录挂载**而非整挂 /app/data，
      # 避免屏蔽镜像内的 prompts。
      - ./data/knowledge:/app/data/knowledge
      - ./data/conversations:/app/data/conversations
      - ./data/profiles:/app/data/profiles
      # 上传知识库(RAG) + 出题 + 采集 + 每用户模型配置（原 /app/backend/data 下的域）
      - ./data/kb:/app/data/kb
      - ./data/rag:/app/data/rag
      - ./data/quiz:/app/data/quiz
      - ./data/collector:/app/data/collector
      # 运行记录 / 调试流水（原 /app/backend/app/data 下）
      - ./data/agent_runs:/app/data/agent_runs
      - ./data/agent_debug:/app/data/agent_debug
      # 应用日志（tutor.log + 轮转备份）
      - ./backend/logs:/app/backend/logs

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
