name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint (ruff, 窄口径：语法/未定义名/错误断言)
        run: ruff check backend/app backend/tests backend-admin/app

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          LLM_API_KEY: test-key
          DASHSCOPE_API_KEY: test-key
          MODEL_NAME: test-model
          LLM_BASE_URL: http://localhost:8000/v1
          EMBED_BASE_URL: http://localhost:8000/v1
          DEFAULT_ADMIN_PASSWORD: test-admin
        run: |
          cd backend
          # -m "not llm_api" 排除 7 条真实付费 API 用例（需 KEY + 网络，CI 无）；
          # 与 pytest-asyncio 无关 —— 该插件已随 requirements-dev.txt 精确锁定
          python -m pytest tests -q -m "not llm_api"
