name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest python-jose[cryptography] bcrypt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          LLM_API_KEY: test-key
          DASHSCOPE_API_KEY: test-key
          MODEL_NAME: test-model
          LLM_BASE_URL: http://localhost:8000/v1
          EMBED_BASE_URL: http://localhost:8000/v1
          DEFAULT_ADMIN_PASSWORD: test-admin
        run: |
          cd backend
          # ponytail: real_api（llm_api marker）需真 key + pytest-asyncio，CI 不具备 → 排除
          python -m pytest tests -q -m "not llm_api"
