name: Backend Admin Tests

# 运维后台（backend-admin）是独立 FastAPI 应用，包名与主后端同为 `app`。
# **必须单独一个 job、单独一次 pytest 调用**：两个套件合跑必 ModuleNotFoundError
# （见 AGENTS.md §0「运维后台套件必须另起一次调用」）。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-admin/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run admin tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          cd backend-admin
          python -m pytest tests -q -m "not llm_api"
